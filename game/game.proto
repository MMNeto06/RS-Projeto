syntax = "proto3";
package game;

service GameService {
  rpc SendMessage (ChatMessage) returns (Ack);
  rpc Ping (PingRequest) returns (PingResponse);
  rpc Attack (AttackRequest) returns (AttackResult);
  rpc StateUpdate (PlayerState) returns (Ack);
  rpc Join (JoinRequest) returns (Ack);
  rpc Leave (LeaveNotification) returns (Ack);
  rpc BroadcastEvent (GameEvent) returns (Ack);
  rpc ValidateAttack (ValidateAttackRequest)  returns (ValidateAttackResponse);
  rpc LobbyNotify    (LobbyNotification)      returns (LobbyNotificationAck);
}

message ChatMessage {
  string sender = 1;
  string content = 2;
  int64 timestamp = 3;
  string match_id = 4;
}

message Ack {
  bool received = 1;
  string by = 2;
}

message PingRequest { 
  string from_user = 1; 
}

message PingResponse { 
  string username = 1; 
  bool alive = 2; 
}

message AttackRequest {
  string attacker = 1;
  string weapon = 2;
  int32 attack_roll = 3; 
  int32 base_damage_roll = 4;
  reserved 5;
  reserved "damage_type";
  string target = 6;
  bool is_spell = 7;
  string attacker_class = 8;
  int32 attacker_x = 9;
  int32 attacker_y = 10;
  int32 effective_range = 11;
}

message AttackResult {
  bool hit = 1;
  int32 damage_dealt = 2;
  int32 target_hp_remaining = 3;
  string status_effect = 4;
  bool target_died = 5;
}

message PlayerState {
  string username = 1;
  int32 hp = 2;
  int32 max_hp = 3;
  int32 x = 4;
  int32 y = 5;
  bool alive = 6;
  string class_name = 7;
  repeated string status_effects = 8;
  int32 armor_class = 9;
  int32 kills = 10;
  int32 deaths = 11;
  string match_id = 12;
}

message JoinRequest {
  string username = 1;
  string class_name = 2;
  string grpc_address = 3;
  int32 port = 4;
}

message LeaveNotification {
  string username = 1;
}

message GameEvent {
  enum EventType {
    PLAYER_DIED = 0;
    MATCH_RESET = 1;
    MATCH_STARTED = 2;
    MATCH_ENDED = 3;
  }
  EventType type = 1;
  string payload = 2;
  int64 timestamp = 3;
  string match_id = 4;
  string event_author = 5; 
}
  
message ValidateAttackRequest {
  string attacker       = 1;
  string attacker_class = 2;
  string weapon         = 3;
  int32  damage         = 4;
  bool   is_spell       = 5;
  string target         = 6;
}

message ValidateAttackResponse {
  bool   approved = 1;
  string reason   = 2;
}

message LobbyNotification {
  enum Type {
    PLAYER_JOINED  = 0;
    PLAYER_LEFT    = 1;
    PLAYER_READY   = 2;
    PLAYER_UNREADY = 3;
    LOBBY_STARTED  = 4;
    LOBBY_CLOSED   = 5;
  }
  Type   type       = 1;
  string username   = 2;
  string lobby_code = 3;
  string payload    = 4;
}

message LobbyNotificationAck {
  bool ok = 1;
}
